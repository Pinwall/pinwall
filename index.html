<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinwall: pin an ad in a campus group, get paid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#dff7ee;--bg2:#ffe9cc;--ink:#0b2b27;--mute:#3f6760;--a1:.62;--a2:.26;--in:rgba(255,255,255,.45);--edge:rgba(255,255,255,.75);--sh:0 20px 50px rgba(20,70,60,.18);--acc:#0b8a6c;--acc-ink:#fff;--o1:#34e0b4;--o2:#ffb454;--o3:#ff7c6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#03211f;--bg2:#190f2e;--ink:#e9fff8;--mute:#93c7ba;--a1:.15;--a2:.04;--in:rgba(255,255,255,.08);--edge:rgba(255,255,255,.2);--sh:0 20px 50px rgba(0,0,0,.5);--acc:#34e0b4;--acc-ink:#04312a}}
:root[data-theme="dark"]{--bg1:#03211f;--bg2:#190f2e;--ink:#e9fff8;--mute:#93c7ba;--a1:.15;--a2:.04;--in:rgba(255,255,255,.08);--edge:rgba(255,255,255,.2);--sh:0 20px 50px rgba(0,0,0,.5);--acc:#34e0b4;--acc-ink:#04312a}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.7;z-index:-1;animation:drift 24s ease-in-out infinite alternate}
.o1{width:46vmax;height:46vmax;background:var(--o1);top:-14vmax;left:-10vmax}
.o2{width:38vmax;height:38vmax;background:var(--o2);bottom:-12vmax;right:-8vmax;animation-delay:-9s}
.o3{width:24vmax;height:24vmax;background:var(--o3);top:42%;left:58%;animation-delay:-15s;opacity:.45}
@keyframes drift{to{transform:translate(6vmax,-4vmax) scale(1.12)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
a{color:var(--acc);font-weight:600}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 18px}
.logo{display:flex;align-items:center;gap:10px;font:800 1.4rem 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em}
.logo i{width:26px;height:26px;border-radius:50% 50% 50% 7px;background:linear-gradient(135deg,var(--o1),var(--o2));box-shadow:inset 0 1px 0 #fff9,0 4px 14px rgba(0,0,0,.2)}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.025em;line-height:1.08;margin:0 0 10px}
h1{font-size:clamp(2.1rem,7vw,3.5rem);font-weight:800}h2{font-size:1.5rem}h3{font-size:1.15rem}
.glass{background:linear-gradient(140deg,rgba(255,255,255,var(--a1)),rgba(255,255,255,var(--a2)));-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--edge);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),var(--sh)}
.pad{padding:20px}.grid{display:grid;gap:14px}.mute{color:var(--mute)}
.two{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.two{grid-template-columns:1.1fr .9fr}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label{display:grid;gap:6px;font-weight:600;font-size:.92rem}
input,textarea{font:inherit;color:var(--ink);background:var(--in);border:1px solid var(--edge);border-radius:14px;padding:11px 13px;width:100%;min-height:44px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,img:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{font:700 1rem Figtree,sans-serif;border:0;border-radius:999px;padding:12px 22px;min-height:44px;background:var(--acc);color:var(--acc-ink);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px rgba(11,138,108,.3)}
.btn.ghost{background:var(--in);color:var(--ink);box-shadow:none;border:1px solid var(--edge)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:6px;padding:6px;border-radius:999px;margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--ink);font:600 .95rem Figtree,sans-serif;padding:10px 18px;border-radius:999px;min-height:44px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
.rung{position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:16px;overflow:hidden;margin-top:8px;border:1px solid transparent;isolation:isolate}
.rung .bar{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--o1),transparent);opacity:.5;z-index:-1}
.rung.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(52,224,180,.35)}
.rung i{font:800 1.25rem 'Bricolage Grotesque',Figtree,sans-serif;font-style:normal}
.chip{padding:3px 11px;border-radius:999px;font-size:.82rem;font-weight:700;background:var(--in);border:1px solid var(--edge)}
.st-approved{background:rgba(52,224,180,.4)}.st-rejected{background:rgba(255,124,107,.45)}.st-review{background:rgba(255,180,84,.45)}
.note{padding:12px 16px;border-radius:16px;margin-bottom:14px;font-weight:600}
.th{display:flex;gap:8px;flex-wrap:wrap}
.th img{width:88px;height:88px;object-fit:cover;border-radius:12px;border:1px solid var(--edge);cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.78);display:grid;place-items:center;z-index:9;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:16px}
pre.ad{white-space:pre-wrap;font:inherit;background:var(--in);border:1px solid var(--edge);border-radius:16px;padding:14px;max-height:250px;overflow:auto;margin:12px 0}
.steps{margin:0;padding-left:1.2rem;display:grid;gap:6px}
.bal{font:800 clamp(2.4rem,9vw,3.6rem)/1 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.03em}
footer{margin-top:26px;font-size:.85rem;text-align:center;display:grid;gap:4px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#ff1f2d;box-shadow:0 0 0 3px rgba(255,31,45,.3),0 0 12px rgba(255,31,45,.9);margin-left:8px;vertical-align:middle}
.acct{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer;padding:16px 18px;min-height:64px}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="wrap"><div id="app"></div><footer class="mute"><span>Support: <a href="tel:+17828127660">+1 (782) 812-7660</a></span></footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const LINK='https://whatsapp.com/channel/0029Vb9NioC6rsQjxph1DE0E';
const TIERS=[[200,500],[100,350],[50,200],[0,100]];
const AD=`STILL Sorting and STRUGGLING WITH COURSES? STILL LOOKING FOR SMARTER WAYS TO SUCCEED? 😩

What if I told you there’s a channel every student should be part of? 👀🔥

No pressure, no judgment, just valuable tools, helpful updates, and resources to make your academic journey easier.

📢 Something BIG is coming for students across the country, and you don’t want to miss out!

🤫 Join quietly, explore, and thank me later.

👇 JOIN NOW BEFORE YOU MISS OUT!

${LINK}`;
const pay=m=>(TIERS.find(t=>m>=t[0])||[0,0])[1];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=n=>'₦'+Number(n).toLocaleString('en-NG');
const uid=()=>Math.random().toString(36).slice(2,10);
const SB_URL='https://tayoqcwiesgoxhesxwiz.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZobWN6em10ampibGRzZ3BiZ3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MTMzNzksImV4cCI6MjExMDQ4OTM3OX0.59t8YvlrwxEf1ncOy4HmQ6lKE-xR7G_2rjXuRCVrMKo';
if(SB_URL.startsWith('PASTE')){document.getElementById('app').innerHTML='<div class="glass pad"><h3>Almost there</h3><p class="mute" style="margin:0">Add your Supabase URL and key at the top of this file, then reload.</p></div>';throw Error('Supabase is not configured')}
const db=supabase.createClient(SB_URL,SB_KEY);
let S={users:[],subs:[],pays:[],feed:[],me:null},ui={tab:'task',mode:'up',msg:''};
const me=()=>S.users.find(u=>u.id===S.me);
const nm=id=>(S.users.find(u=>u.id===id)||{name:'Unknown'}).name;
const home=()=>{ui.acct='';ui.tab=(me()||{}).role==='admin'?'queue':'task'};
const shrink=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const w=Math.min(900,i.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(i.height*w/i.width);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(Error('Could not read that image.')),'image/jpeg',.7)};i.onerror=()=>no(Error('That file is not a readable image.'));i.src=u});
const put=async(p,f)=>{const {error}=await db.storage.from('proofs').upload(p,await shrink(f),{contentType:'image/jpeg'});if(error)throw Error(error.message)};
const bal=id=>{const e=S.subs.filter(s=>s.uid===id&&s.st==='approved').reduce((a,s)=>a+s.pay,0),o=S.pays.filter(p=>p.uid===id).reduce((a,p)=>a+p.amt,0),w=S.subs.filter(s=>s.uid===id&&s.st==='review').reduce((a,s)=>a+pay(s.m),0);return{e,w,b:e-o}};
async function load(){
const {data:{session}}=await db.auth.getSession();
if(!session){S={users:[],subs:[],pays:[],feed:(await db.rpc('recent_payouts')).data||[],me:null};return}
const [p,s,y]=await Promise.all([db.from('profiles').select('*'),db.from('submissions').select('*').order('ts'),db.from('payouts').select('*').order('ts')]);
S={users:p.data||[],subs:s.data||[],pays:y.data||[],feed:[],me:session.user.id};
const paths=S.subs.flatMap(x=>Object.values(x.img||{})),m={};
if(paths.length){const {data}=await db.storage.from('proofs').createSignedUrls(paths,3600);(data||[]).forEach(r=>{m[r.path]=r.signedUrl})}
S.subs.forEach(x=>{x.imgu={};for(const k in x.img)x.imgu[k]=m[x.img[k]]});
if(!me())ui.msg='Your profile is missing. Run setup.sql in Supabase, then create the account again.';
}
const head=u=>`<header><div class="logo"><i></i>Pinwall</div>${u?`<div class="row"><span class="mute">${esc(u.name)}${u.role==='admin'?' (admin)':''}</span><button class="btn ghost" data-act="out">Sign out</button></div>`:''}</header>`;
const tabs=l=>`<nav class="tabs glass">${l.map(([k,t])=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-v="${k}">${t}</button>`).join('')}</nav>`;
const lab=i=>i===0?`${TIERS[0][0]}+ members`:i===TIERS.length-1?`Under ${TIERS[i-1][0]} members`:`${TIERS[i][0]}–${TIERS[i-1][0]-1} members`;
const ladder=()=>`<div class="glass pad ladder"><h3>What a group pays</h3><label>Members in the group<input class="calc" type="number" min="0" inputmode="numeric" placeholder="Type a number to see the rate"></label>${TIERS.map(([m,p],i)=>`<div class="rung" data-min="${m}"><span class="bar" style="width:${p/5}%"></span><b>${lab(i)}</b><i>${N(p)}</i></div>`).join('')}<p class="mute" style="margin:12px 0 0">Big groups always pay the full ${N(TIERS[0][1])}. Smaller groups pay less.</p></div>`;
const feed=()=>{const p=S.feed;return `<div class="glass pad"><h3>Recent payouts</h3>${p.length?p.map(x=>`<div class="row"><span>${esc(x.name)}</span><b>${N(x.amt)}</b><span class="mute">${new Date(x.paid).toLocaleDateString()}</span></div>`).join(''):'<p class="mute" style="margin:0">No payouts yet. Each one shows up here after it is paid.</p>'}</div>`};
const auth=()=>{if(ui.mode==='forgot')return forgot();const up=ui.mode==='up';return `<div class="tabs glass"><button class="${up?'on':''}" data-act="mode" data-v="up">Create account</button><button class="${up?'':'on'}" data-act="mode" data-v="in">Log in</button></div><form class="grid" data-f="${up?'signup':'login'}">${up?'<label>Your name<input name="n" autocomplete="name" required></label>':''}<label>Email<input name="e" type="email" autocomplete="email" required></label><label>Password<input name="p" type="password" minlength="6" autocomplete="${up?'new-password':'current-password'}" required></label><button class="btn">${up?'Create account':'Log in'}</button></form>${up?'':'<p class="mute" style="margin:14px 0 0"><button type="button" class="btn ghost" data-act="mode" data-v="forgot">Email me a reset link</button></p><p class="mute" style="margin:10px 0 0">Forgot your email? Call support on <a href="tel:+17828127660">+1 (782) 812-7660</a> and we’ll help you back in.</p>'}`};
const land=()=>`<div class="two"><section class="grid" style="align-content:start"><h1>Pin an ad in a campus group. Get paid for it.</h1><p class="mute" style="font-size:1.1rem;max-width:36ch;margin:0">Post our ad in a department group, send proof, and earn up to ${N(TIERS[0][1])} per group. Every rate is listed below.</p>${ladder()}${feed()}</section><section class="glass pad" style="align-self:start">${auth()}</section></div>`;
const thumbs=s=>`<div class="th">${Object.entries(s.imgu||{}).map(([k,v])=>`<img src="${v}" alt="${{a:'Posted ad',i:'Group name and members',v:'Message views'}[k]}" data-zoom tabindex="0">`).join('')}</div>`;
const STT={posted:'Add views screenshot',review:'In review',approved:'Approved',rejected:'Rejected'};

const task=()=>`<div class="two"><section class="grid" style="align-content:start"><div class="glass pad"><h2>Post the channel ad</h2><p class="mute" style="margin:0">Invite students to our WhatsApp channel by posting this ad in a department group.</p><pre class="ad">${esc(AD)}</pre><div class="row"><button class="btn" data-act="copy">Copy ad</button><a href="${LINK}" target="_blank" rel="noopener">Open the channel</a></div></div><div class="glass pad"><h3>How it works</h3><ol class="steps"><li>Post the ad in a department group.</li><li>Screenshot the posted ad, then the group’s name and member list.</li><li>Submit both here. Later, add a screenshot of the message info to show the views.</li><li>We review it and the pay goes to your wallet.</li></ol></div></section><section class="grid" style="align-content:start">${ladder()}<form class="glass pad grid" data-f="sub"><h3 style="margin:0">Submit a group</h3><label>Group name<input name="g" maxlength="80" required></label><label>Number of members<input name="m" type="number" min="1" inputmode="numeric" required></label><label>Screenshot of the posted ad<input name="a" type="file" accept="image/*" required></label><label>Screenshot of the group name and members<input name="i" type="file" accept="image/*" required></label><button class="btn">Save group post</button></form></section></div>`;
const posts=u=>{const l=S.subs.filter(s=>s.uid===u.id).reverse();return l.length?`<div class="grid">${l.map(s=>`<div class="glass pad grid"><div class="row"><h3 style="margin:0">${esc(s.g)}</h3><span class="chip st-${s.st}">${STT[s.st]}</span></div><div class="mute">${s.m} members. ${s.st==='approved'?N(s.pay)+' added to your wallet.':N(pay(s.m))+' at this size.'}</div>${thumbs(s)}${s.st==='posted'?`<form class="grid" data-f="views" data-id="${s.id}"><label>Screenshot of the message info showing views<input name="v" type="file" accept="image/*" required></label><button class="btn">Send for review</button></form>`:''}${s.st==='rejected'?`<div class="note st-rejected">${esc(s.why||'Rejected.')}</div>`:''}</div>`).join('')}</div>`:'<div class="glass pad"><h3>No posts yet</h3><p class="mute" style="margin:0">Submit your first group from the Task tab.</p></div>'};
const wallet=u=>{const b=bal(u.id),h=S.pays.filter(p=>p.uid===u.id).reverse();return `<div class="two"><section class="glass pad grid" style="align-content:start"><div class="mute">Available balance</div><div class="bal">${N(b.b)}</div><div class="row"><span>Earned ${N(b.e)}</span><span>In review ${N(b.w)}</span></div></section><form class="glass pad grid" data-f="wd"><h3 style="margin:0">Withdraw</h3><label>Amount in naira<input name="a" type="number" min="1" max="${b.b}" required></label><label>Bank, account number and account name<textarea name="d" rows="2" required></textarea></label><button class="btn" ${b.b?'':'disabled'}>Request payout</button></form></div><div class="glass pad" style="margin-top:14px"><h3>Payout history</h3>${h.length?h.map(p=>`<div class="row"><b>${N(p.amt)}</b><span class="chip ${p.st==='paid'?'st-approved':'st-review'}">${p.st==='paid'?'Paid':'Pending'}</span><span class="mute">${new Date(p.ts).toLocaleDateString()}</span></div>`).join(''):'<p class="mute" style="margin:0">No payout requests yet.</p>'}</div>`};
const worker=u=>tabs([['task','Task'],['posts','My posts'],['wallet','Wallet']])+(ui.tab==='posts'?posts(u):ui.tab==='wallet'?wallet(u):task());

const queue=id=>{const q=S.subs.filter(s=>s.uid===id).reverse();return q.length?`<div class="grid">${q.map(s=>`<div class="glass pad grid"><div class="row"><h3 style="margin:0">${esc(s.g)}</h3><span class="chip st-${s.st}">${STT[s.st]}</span></div><div class="mute">Claims ${s.m} members.${s.st==='approved'?' '+N(s.pay)+' paid into the wallet.':''}${s.st==='rejected'?' '+esc(s.why||''):''}</div>${thumbs(s)}${s.st!=='review'?'':`<form class="grid" data-f="ok" data-id="${s.id}"><label>Verified members<input name="m" type="number" min="0" value="${s.m}" required></label><label>Reason, if rejecting<input name="w" maxlength="120"></label><div class="row"><button class="btn" name="act" value="ok">Approve and pay by size</button><button class="btn ghost" name="act" value="no">Reject</button></div></form>`}</div>`).join('')}</div>`:'<div class="glass pad"><h3>No uploads yet</h3><p class="mute" style="margin:0">This worker has not submitted a group.</p></div>'};
const pays=()=>{const p=S.pays.slice().reverse();return p.length?`<div class="grid">${p.map(x=>`<div class="glass pad grid"><div class="row"><h3 style="margin:0">${esc(nm(x.uid))}</h3><b>${N(x.amt)}</b></div><div class="mute" style="white-space:pre-wrap">${esc(x.det)}</div>${x.st==='paid'?'<span class="chip st-approved" style="justify-self:start">Paid</span>':`<button class="btn" data-act="paid" data-id="${x.id}">Mark as paid</button>`}</div>`).join('')}</div>`:'<div class="glass pad"><h3>No payout requests</h3><p class="mute" style="margin:0">Requests from workers show up here.</p></div>'};
const fresh=id=>{const u=S.users.find(x=>x.id===id),t=new Date((u&&u.seen_at)||0);return S.subs.some(s=>s.uid===id&&new Date(s.up||s.ts)>t)};
const dot=()=>'<span class="dot" role="img" aria-label="New upload"></span>';
const accts=()=>{const w=S.users.filter(u=>u.role!=='admin');return w.length?`<div class="grid">${w.map(u=>`<button class="glass acct" data-act="acct" data-v="${u.id}"><span><b>${esc(u.name)}</b>${fresh(u.id)?dot():''}<br><span class="mute">${esc(u.email)}</span></span><span class="mute">${S.subs.filter(s=>s.uid===u.id).length} posts</span></button>`).join('')}</div>`:'<div class="glass pad"><h3>No accounts yet</h3><p class="mute" style="margin:0">Workers appear here as they sign up.</p></div>'};
const acctView=id=>{const u=S.users.find(x=>x.id===id);return u?`<button class="btn ghost" data-act="acct" data-v="" style="margin-bottom:14px">Back to accounts</button><div class="glass pad grid" style="margin-bottom:14px"><h2 style="margin:0">${esc(u.name)}</h2><div class="mute">${esc(u.email)}</div><div class="mute">Forgot their password? They can tap “Email me a reset link” on the log in screen.</div></div>${queue(u.id)}`:accts()};
const admin=()=>{const m=S.pays.filter(p=>p.st==='pending').length,f=S.users.some(u=>u.role!=='admin'&&fresh(u.id));return tabs([['queue',`Accounts${f?dot():''}`],['pays',`Payouts (${m})`]])+(ui.tab==='pays'?pays():ui.acct?acctView(ui.acct):accts())};

const forgot=()=>`<h3>Reset your password</h3><form class="grid" data-f="forgot"><label>Email<input name="e" type="email" autocomplete="email" required></label><button class="btn">Email me a reset link</button></form><button class="btn ghost" data-act="mode" data-v="in" style="margin-top:12px">Back to log in</button>`;
const resetForm=()=>`<h3>Choose a new password</h3><form class="grid" data-f="setpw"><label>New password<input name="p" type="password" minlength="6" autocomplete="new-password" required></label><button class="btn">Save password</button></form>`;
function render(){const u=me();$('#app').innerHTML=head(u)+(ui.msg?`<div class="note glass" role="alert">${esc(ui.msg)}</div>`:'')+(ui.mode==='reset'?`<div class="glass pad" style="max-width:420px;margin:0 auto">${resetForm()}</div>`:u?(u.role==='admin'?admin():worker(u)):land())}

const H={
async signup(d){const n=d.get('n').trim(),p=d.get('p');if(!n||p.length<6)throw Error('Enter your name and a password of at least 6 characters.');const {data,error}=await db.auth.signUp({email:d.get('e').trim().toLowerCase(),password:p,options:{data:{name:n}}});if(error)throw Error(error.message);if(!data.session)throw Error('Check your email to confirm your account, then log in.');await load();home()},
async login(d){const {error}=await db.auth.signInWithPassword({email:d.get('e').trim().toLowerCase(),password:d.get('p')});if(error)throw Error('Email or password is wrong.');await load();home()},
async forgot(d){const {error}=await db.auth.resetPasswordForEmail(d.get('e').trim().toLowerCase(),{redirectTo:location.origin+location.pathname});if(error)throw Error(error.message);ui.mode='in';ui.msg='If that email has an account, a reset link is on its way. Check your inbox and spam.'},
async setpw(d){const {error}=await db.auth.updateUser({password:d.get('p')});if(error)throw Error(error.message);ui.mode='in';ui.msg='Password updated.';history.replaceState(null,'',location.pathname);await load();home()},
async sub(d){const id=crypto.randomUUID(),a=`${S.me}/${id}-a.jpg`,i=`${S.me}/${id}-i.jpg`;await put(a,d.get('a'));await put(i,d.get('i'));const {error}=await db.from('submissions').insert({id,uid:S.me,g:d.get('g').trim(),m:+d.get('m'),img:{a,i}});if(error)throw Error(error.message);ui.tab='posts';await load()},
async views(d,f){const s=S.subs.find(x=>x.id===f.dataset.id),p=`${S.me}/${s.id}-v${Date.now()}.jpg`;await put(p,d.get('v'));const {error}=await db.from('submissions').update({img:{...s.img,v:p},st:'review',up:new Date().toISOString()}).eq('id',s.id);if(error)throw Error(error.message);await load()},
async ok(d,f,b){const m=+d.get('m'),u=b.value==='ok'?{st:'approved',m,pay:pay(m)}:{st:'rejected',why:d.get('w')||'Rejected by the reviewer.'};const {error}=await db.from('submissions').update(u).eq('id',f.dataset.id);if(error)throw Error(error.message);await load()},
async wd(d){const {error}=await db.rpc('request_payout',{p_amt:+d.get('a'),p_det:d.get('d')});if(error)throw Error(error.message);await load()}
};
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,b=e.submitter;if(b)b.disabled=true;ui.msg='';try{await H[f.dataset.f](new FormData(f),f,b)}catch(x){ui.msg=x.message||'Something went wrong.'}render()});
document.addEventListener('click',async e=>{
const z=e.target.closest('[data-zoom]');
if(z){const l=document.createElement('div');l.className='lb';l.innerHTML=`<img src="${z.src}" alt="">`;l.onclick=()=>l.remove();document.body.append(l);return}
const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;ui.msg='';
try{
if(a==='tab'){ui.tab=t.dataset.v;ui.acct=''}
else if(a==='acct'){ui.acct=t.dataset.v;const u=S.users.find(x=>x.id===ui.acct);if(u){u.seen_at=new Date().toISOString();await db.from('profiles').update({seen_at:u.seen_at}).eq('id',u.id)}}
else if(a==='mode')ui.mode=t.dataset.v;
else if(a==='out'){await db.auth.signOut();ui.mode='in';await load()}
else if(a==='paid'){const {error}=await db.from('payouts').update({st:'paid',paid:new Date().toISOString()}).eq('id',t.dataset.id);if(error)throw Error(error.message);await load()}
else if(a==='copy'){if(navigator.clipboard)navigator.clipboard.writeText(AD).then(()=>{t.textContent='Copied'},()=>{t.textContent='Select the text to copy'});return}
}catch(x){ui.msg=x.message||'Something went wrong.'}
render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-zoom]'))e.target.click()});
document.addEventListener('input',e=>{if(!e.target.classList.contains('calc'))return;const v=e.target.value,box=e.target.closest('.ladder');let hit=false;box.querySelectorAll('.rung').forEach(r=>{const on=!hit&&v!==''&&+v>=+r.dataset.min;r.classList.toggle('on',on);if(on)hit=true})});

db.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){ui.mode='reset';setTimeout(()=>load().then(render),0)}});
load().then(()=>{home();render()});
</script>
</body>
</html>
